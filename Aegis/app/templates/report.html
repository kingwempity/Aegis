<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Aegis 安全扫描报告</title>
    <style>
        body { font-family: "SimSun", serif; padding: 20px; }
        h1 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .summary { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .vuln-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; page-break-inside: avoid; }
        .severity-high { color: #e74c3c; font-weight: bold; }
        .severity-medium { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Aegis 安全扫描报告</h1>
    
    <div class="summary">
        <p><strong>目标 URL:</strong> {{ task.target_url }}</p>
        <p><strong>扫描时间:</strong> {{ task.created_at }}</p>
        <p><strong>发现漏洞数:</strong> {{ vulns|length }}</p>
    </div>

    <h2>漏洞详情</h2>
    {% for v in vulns %}
    <div class="vuln-card">
        <h3>{{ v.vuln_name }}</h3>
        <p>风险等级: <span class="severity-{{ v.severity|lower }}">{{ v.severity }}</span></p>
        <p>触发 URL: {{ v.url }}</p>
        <pre>{{ v.evidence }}</pre>
    </div>
    {% else %}
    <p>太棒了！未发现任何漏洞。</p>
    {% endfor %}
</body>
</html>
