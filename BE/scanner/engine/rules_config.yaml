        adjustment: 0.20
        description: "目标确认是Drupal框架，提升置信度"
      - factor_name: "response_expected_framework"
        condition: "response_is_expected_framework"
        adjustment: 0.20
        description: "响应再次确认目标框架匹配"
      - factor_name: "drupal_exclusive_hit"
        condition: "response_has_drupal_exclusive_sig"
        adjustment: 0.25
        description: "响应包含Drupal独有特征"

  django-cve-2017-12794:
    plugin_id: "django-cve-2017-12794"
    expected_frameworks: ["django"]
    validation_level: "strict"
    min_confidence: 0.45
    required_evidence_count: 3
