id: git-config-leak
info:
  name: Git Config Disclosure
  severity: High
  description: |
    检测.git目录泄露漏洞，当Web服务器未正确配置时，可能暴露.git配置文件，
    导致源代码泄露。攻击者可利用此信息还原完整源代码。
  tags:
    - info-leak
    - git
    - source-code-disclosure
  reference:
    - https://owasp.org/www-community/attacks/Forced_browsing

requests:
  - method: GET
    stage: git_metadata_probe
    stage_title: Git Metadata Exposure Probe
    stage_goal: 验证 Git 仓库元数据文件是否可直接访问，并确认响应具备真实 Git 特征。
    path:
      - "{{BaseURL}}/.git/config"
      - "{{BaseURL}}/.git/HEAD"
      - "{{BaseURL}}/.gitignore"
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "[core]"
          - "repositoryformatversion"
          - "ref: refs/heads/"
        condition: or
        part: body
      - type: word
        words:
          - "bare = false"
          - "logallrefupdates"
          - "[remote \"origin\"]"
          - "[branch \""
        condition: or
        part: body
      - type: status
        status: [200]

  - method: GET
    stage: git_repository_index_probe
    stage_title: Git Repository Index Probe
    stage_goal: 验证 Git 索引或引用目录是否可访问，并确认返回内容不是普通错误页。
    path:
      - "{{BaseURL}}/.git/index"
      - "{{BaseURL}}/.git/objects/"
      - "{{BaseURL}}/.git/refs/heads/"
      - "{{BaseURL}}/.git/refs/tags/"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "DIRC"
          - "Index of"
          - "tree"
          - "parent"
          - "object"
        condition: or
        part: body
