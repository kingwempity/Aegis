services:
  # ==================== 数据层 ====================
  
  # 数据库
  aegis-db:
    image: mysql:8.0
    container_name: aegis-db
    restart: always
    command: >
      --sort-buffer-size=2097152
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
    environment:
      MYSQL_DATABASE: aegis
      MYSQL_ROOT_PASSWORD: aegis_password
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10

  # 缓存
  aegis-redis:
    image: redis:7.2.5-alpine
    container_name: aegis-redis
    restart: always
    command: >
      redis-server 
      --maxmemory 64m 
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command KEYS ""
      --rename-command CONFIG ""
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== 应用层 ====================
  
  # API 服务（后端）
  aegis-api:
    build: .
    container_name: aegis-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # 保留镜像内构建的前端静态资源，避免宿主机 bind mount 覆盖 /app/static
      - /app/static
    environment:
      - DB_USER=root
      - DB_PASSWORD=aegis_password
      - DB_HOST=aegis-db
      - DB_NAME=aegis
      - REDIS_URL=redis://aegis-redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-aegis-secret-key-change-in-production}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-3}
      - PYTHONPATH=/app/BE:/app
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - frontend-network
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Worker 服务（后端）
  aegis-worker:
    build: .
    container_name: aegis-worker
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=10
    volumes:
      - .:/app
      - /app/static
    environment:
      - DB_USER=root
      - DB_PASSWORD=aegis_password
      - DB_HOST=aegis-db
      - DB_NAME=aegis
      - REDIS_URL=redis://aegis-redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-aegis-secret-key-change-in-production}
      - PYTHONPATH=/app/BE:/app
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
      - FASTAPI_URL=http://aegis-api:8000
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-redis:
        condition: service_healthy
      aegis-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - frontend-network
      - backend-network
      - aegis-shared-net

# ==================== 网络分区配置 ====================

networks:
  frontend-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

  backend-network:
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

  aegis-shared-net:
    external: true
