# Compose v2 不再需要 version 字段，可省略
services:
  # 数据库
  aegis-db:
    image: mysql:8.0
    container_name: aegis-db
    restart: always
    environment:
      MYSQL_DATABASE: aegis
      MYSQL_ROOT_PASSWORD: aegis_password
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 缓存
  aegis-redis:
    image: redis:alpine
    container_name: aegis-redis
    restart: always
    networks:
      - aegis-network

  # API 服务（资产发现从容器内发起，经宿主机访问 VPC，一般无需改 Docker 网络）
  aegis-api:
    build: .
    container_name: aegis-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DB_USER=root
      - DB_PASSWORD=aegis_password
      - DB_HOST=aegis-db
      - DB_NAME=aegis
      - REDIS_URL=redis://aegis-redis:6379/0
      # 资产发现默认扫描网段。与 ECS 私网 172.17.34.239 同子网，可发现同 VPC 内其他资产
      - DISCOVERY_DEFAULT_NETWORK_RANGE=172.17.34.0/24
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-redis:
        condition: service_started
    networks:
      - aegis-network

  # Worker 服务
  aegis-worker:
    build: .
    container_name: aegis-worker
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_USER=root
      - DB_PASSWORD=aegis_password
      - DB_HOST=aegis-db
      - DB_NAME=aegis
      - REDIS_URL=redis://aegis-redis:6379/0
    depends_on:
      aegis-db:
        condition: service_healthy
      aegis-redis:
        condition: service_started
    networks:
      - aegis-network

networks:
  aegis-network:
    driver: bridge
