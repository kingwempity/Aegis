<!DOCTYPE html>
<html>
<head>
    <title>测试DOCX导出功能</title>
</head>
<body>
    <h1>测试DOCX导出功能</h1>
    <button onclick="testDOCX()">测试DOCX导出</button>

    <script type="module">
        async function testDOCX() {
            try {
                // 导入docx库
                const {
                    Document,
                    Packer,
                    Paragraph,
                    TextRun,
                    Table,
                    TableCell,
                    TableRow,
                    WidthType,
                    AlignmentType,
                } = await import('https://unpkg.com/docx@8.5.0/build/index.js');

                console.log('DOCX库加载成功');

                const children = [];

                // 标题
                children.push(
                    new Paragraph({
                        children: [
                            new TextRun({
                                text: 'Web应用程序漏洞检测报告',
                                bold: true,
                                size: 32,
                                color: '2C3E50',
                            }),
                        ],
                        alignment: AlignmentType.CENTER,
                        spacing: { after: 400 },
                    })
                );

                // 基本信息
                children.push(
                    new Paragraph({
                        children: [
                            new TextRun({ text: '任务ID: test_task_123', size: 24 }),
                        ],
                        spacing: { after: 200 },
                    }),
                    new Paragraph({
                        children: [
                            new TextRun({ text: '目标URL: http://example.com', size: 24 }),
                        ],
                        spacing: { after: 200 },
                    })
                );

                // 创建文档
                const doc = new Document({
                    sections: [
                        {
                            properties: {},
                            children: children,
                        },
                    ],
                });

                console.log('文档创建成功');

                // 生成并下载
                const buffer = await Packer.toBlob(doc);
                console.log('Blob生成成功，大小:', buffer.size);

                const url = window.URL.createObjectURL(buffer);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'test_report.docx';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                alert('DOCX导出测试成功！');
            } catch (error) {
                console.error('DOCX导出失败:', error);
                alert('DOCX导出失败: ' + error.message);
            }
        }

        // 页面加载完成后显示测试按钮
        window.addEventListener('load', function() {
            console.log('页面加载完成，可以测试DOCX导出了');
        });
    </script>
</body>
</html>
